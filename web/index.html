<!doctype html>
<html lang="pt-BR" data-tema="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar de Estágio — Painel (mockup)</title>
    <meta
      name="description"
      content="Protótipo visual do painel web da Fase 3 do Radar de Estágio. Dados fictícios, sem back-end."
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="faixa-mockup" role="note">
      Protótipo visual — dados fictícios, nenhuma ação tem efeito real
    </div>

    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <header class="barra-topo">
      <a class="marca" href="#/hoje" aria-label="Radar de Estágio, ir para Hoje">
        <svg class="icone icone-lg" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-radar"></use></svg>
        <span class="marca-nome">Radar de Estágio</span>
      </a>

      <form class="busca" role="search" onsubmit="return false">
        <svg class="icone busca-icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-busca"></use></svg>
        <input
          type="search"
          id="busca-global"
          placeholder="Buscar vaga, empresa ou skill (ex.: React, Nubank)"
          aria-label="Buscar"
        />
      </form>

      <button class="botao-icone" id="alternar-tema" type="button" aria-label="Alternar tema claro e escuro">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tema"></use></svg>
      </button>

      <a class="usuario" href="#/perfil" aria-label="Abrir seu perfil">
        <span class="avatar" aria-hidden="true">MF</span>
        <span class="usuario-nome">Miguel F.</span>
      </a>

      <button class="botao-icone menu-alternar" id="alternar-menu" type="button" aria-label="Abrir menu">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg>
      </button>
    </header>

    <div class="corpo">
      <nav class="menu-lateral" id="menu-lateral" aria-label="Navegação principal">
        <a class="menu-item" href="#/hoje" data-rota="hoje">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hoje"></use></svg>
          <span>Hoje</span>
        </a>
        <a class="menu-item" href="#/historico" data-rota="historico">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-historico"></use></svg>
          <span>Histórico</span>
        </a>
        <a class="menu-item" href="#/mercado" data-rota="mercado">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mercado"></use></svg>
          <span>Mercado</span>
        </a>
        <a class="menu-item" href="#/perfil" data-rota="perfil">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-perfil"></use></svg>
          <span>Perfil</span>
        </a>
        <a class="menu-item" href="#/configuracoes" data-rota="configuracoes">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-config"></use></svg>
          <span>Configurações</span>
        </a>
      </nav>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <nav class="trilha" id="trilha" aria-label="Você está aqui"></nav>
        <div id="tela"></div>
      </main>
    </div>

    <div class="avisos" id="avisos" aria-live="polite" aria-atomic="false"></div>

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="i-radar" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34" /><path d="M4 6h.01" />
          <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35" /><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67" />
          <path d="M12 18h.01" /><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67" />
          <circle cx="12" cy="12" r="2" /><path d="m13.41 10.59 5.66-5.66" />
        </g>
        <g id="i-busca" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
        </g>
        <g id="i-hoje" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </g>

        </g>

        </g>

        </g>
        <g id="i-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <circle cx="12" cy="12" r="3" />
        </g>
        <g id="i-tema" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
        </g>
        <g id="i-menu" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </g>

        </g>

        </g>

          <path d="M17 14V2" /><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z" />
        </g>
        <g id="i-alerta" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" />
        </g>
        <g id="i-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />

        <g id="i-x" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />

      </defs>
    </svg>

    <script src="assets/data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
